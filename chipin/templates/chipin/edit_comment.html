{% extends 'chipin/base.html' %}
{% block title %}Edit Comment{% endblock %}
{% block content %}
<h1>Edit Comment</h1>
<form method="post">
    {% csrf_token %}
    {{ form.content.errors }}
    <p>{{ form.content }}</p>
    <button type="submit">Save Comment</button>
</form>
<a href="{% url 'chipin:group_detail' group.id %}">Back to Group</a>
{% endblock %}
